<meta name="theme-color" content="#030814">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout concept: one fixed WebGL stage (the five-layer stack) behind a scrolling story.
   Text sits left/right in alternation, the stack moves to the opposite side and changes state per section. */
:root{
  --bg:#030814; --bg-2:#071428;
  --panel:rgba(7,18,40,.66); --panel-hi:rgba(12,30,62,.78);
  --ink:#eaf4ff; --ink-2:#a8bcd8; --ink-3:#6c86a8;
  --blue:#2f7bff; --cyan:#26e1ff;
  --line:rgba(120,170,255,.2); --line-2:rgba(120,190,255,.42);
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}

#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
   radial-gradient(60% 50% at 82% 8%,rgba(47,123,255,.20),transparent 70%),
   radial-gradient(120% 90% at 50% 120%,rgba(3,8,20,.0),rgba(3,8,20,.55) 100%)}
main,footer{position:relative;z-index:2}

.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px;background:linear-gradient(180deg,rgba(3,8,20,.92),rgba(3,8,20,.62));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:600;font-size:1.08rem;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
.brand img{width:38px;height:38px;display:block}
.brand i{font-style:normal;color:var(--cyan)}
.links{display:flex;gap:2px;margin-inline:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{position:relative;padding:10px 13px;font:600 .7rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--ink-2);white-space:nowrap;transition:color .25s}
.links a:hover{color:var(--ink)}
.links a.on{color:var(--ink)}
.links a.on::after{content:"";position:absolute;left:13px;right:13px;bottom:1px;height:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.lang{display:flex;gap:2px;font:600 .72rem var(--f-mono);letter-spacing:.1em}
.lang button{background:none;border:0;padding:8px 8px;color:var(--ink-3)}
.lang button[aria-pressed="true"]{color:var(--cyan)}
#bar{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--blue),var(--cyan))}
@media(max-width:860px){.nav .wrap{flex-wrap:wrap;gap:6px 12px}.brand{margin-right:auto}.links{order:3;flex-basis:100%;margin:0}}

/* hud */
.hud{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:14px;align-items:center;font:500 .68rem var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);pointer-events:none}
.hud b{color:var(--cyan);font-weight:700}
@media(max-width:860px){.hud{display:none}}

/* sections */
.sec{position:relative;padding-block:clamp(72px,12vh,132px)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:28px}
.col{grid-column:1 / span 6;min-width:0}
.sec[data-side="r"] .col{grid-column:7 / span 6}
.wide{grid-column:1 / -1;min-width:0}
@media(max-width:900px){
  .col,.sec[data-side="r"] .col{grid-column:1 / -1;background:rgba(3,8,20,.74);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
  .grid{gap:18px}
}
.eyebrow{display:flex;align-items:center;gap:14px;font:500 .72rem var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.eyebrow .ix{color:var(--ink-3)}
.eyebrow::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,var(--cyan),transparent)}
h1{font:700 clamp(2.5rem,6.2vw,5.4rem)/1.02 var(--f-display);letter-spacing:-.04em;text-wrap:balance;margin-top:22px}
h2{font:700 clamp(1.9rem,4.2vw,3.5rem)/1.06 var(--f-display);letter-spacing:-.035em;text-wrap:balance;margin-top:20px}
h3{font:600 1.05rem/1.3 var(--f-display);letter-spacing:-.01em}
.dot{color:var(--cyan)}
.w{display:inline}
@keyframes focus{from{opacity:.3;filter:blur(8px);transform:translateY(.22em)}to{opacity:1;filter:none;transform:none}}
.lede{margin-top:24px;font-size:clamp(1rem,1.45vw,1.17rem);line-height:1.7;color:var(--ink-2);max-width:56ch;text-wrap:pretty}
.lede.bar{border-left:2px solid var(--cyan);padding-left:18px}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:8px 14px;border:1px solid var(--line-2);border-radius:999px;font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);background:rgba(7,18,40,.5)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:14px;border:1px solid var(--line-2);background:rgba(10,26,54,.7);text-decoration:none;font-weight:600;font-size:.95rem;transition:border-color .25s,background .25s,transform .25s}
.btn:hover{border-color:var(--cyan);background:rgba(16,44,88,.85);transform:translateY(-2px)}
.btn.main{background:linear-gradient(135deg,#1f66ff,#17c3ff);border-color:transparent;color:#021024}
.btn.main:hover{filter:brightness(1.1)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:clamp(18px,2.4vw,30px)}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:56px}
.pill{display:flex;gap:14px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
.pill svg{flex:none;width:30px;height:30px;color:var(--cyan)}
.pill b{display:block;font:600 .85rem var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.pill span{display:block;font-size:.88rem;color:var(--ink-2);line-height:1.4}
@media(max-width:760px){.pills{grid-template-columns:1fr;margin-top:36px}}

/* layers list */
.layers{display:grid;gap:10px;margin-top:34px}
.layers button{width:100%;display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:2px;align-items:center;text-align:left;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);transition:border-color .3s,background .3s,transform .3s}
.layers .sw{grid-row:span 2;width:14px;height:44px;border-radius:7px;background:var(--c);box-shadow:0 0 18px var(--c);opacity:.7;transition:opacity .3s}
.layers b{font:600 1rem var(--f-display)}
.layers span.d{font-size:.9rem;color:var(--ink-2);line-height:1.45}
.layers button:hover,.layers button.on{border-color:var(--c);background:var(--panel-hi);transform:translateX(4px)}
.layers button:hover .sw,.layers button.on .sw{opacity:1}
.sec-card{display:flex;gap:16px;align-items:flex-start;margin-top:14px}
.sec-card svg{flex:none;width:34px;height:34px;color:var(--cyan)}
.sec-card p{font-size:.92rem;color:var(--ink-2);margin-top:4px}

/* modes */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(7,18,40,.6);font:600 .82rem var(--f-mono);letter-spacing:.04em;transition:all .25s}
.tabs button:hover{border-color:var(--line-2)}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,rgba(31,102,255,.5),rgba(23,195,255,.35));border-color:var(--cyan);color:#fff}
.mwrap{overflow-x:auto;margin-top:22px}
.mflow{display:block;width:100%;min-width:600px;height:auto}
.mflow text{font-family:var(--f-mono);fill:var(--ink-2);font-size:22px;letter-spacing:.14em;text-anchor:middle}
.mflow .lk{fill:none;stroke:var(--line-2);stroke-width:2;opacity:.35;transition:all .45s}
.mflow .nd{opacity:.38;transition:opacity .45s}
.mflow .nd circle.ring{fill:rgba(7,22,48,.9);stroke:var(--cyan);stroke-width:2}
.mflow .nd .gl{stroke:var(--cyan);stroke-width:4;stroke-linecap:round;fill:none}
.mflow .nd .li{fill:#fff;font:700 30px var(--f-display);letter-spacing:0}
.mflow .pk{fill:var(--cyan);opacity:0;transition:opacity .4s}
.mflow .chip{opacity:0;transition:opacity .45s}
.mflow .chip rect{fill:rgba(7,22,48,.92);stroke:var(--cyan);stroke-width:1.5}
.mflow .chip text{fill:var(--cyan);font-size:18px;letter-spacing:.06em}
.mflow[data-mode="c2h"] .arc,
.mflow[data-mode="c2l"] .l1,
.mflow[data-mode="c2l2h"] .l1,.mflow[data-mode="c2l2h"] .l2,
.mflow[data-mode="tr"] .l1,.mflow[data-mode="tr"] .l2{stroke:var(--cyan);opacity:1;stroke-dasharray:4 10;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.mflow[data-mode="c2h"] .nd-c,.mflow[data-mode="c2h"] .nd-h,
.mflow[data-mode="c2l"] .nd-c,.mflow[data-mode="c2l"] .nd-l,
.mflow[data-mode="c2l2h"] .nd,.mflow[data-mode="tr"] .nd{opacity:1}
.mflow[data-mode="c2h"] .pk-a,
.mflow[data-mode="c2l"] .pk-1,
.mflow[data-mode="c2l2h"] .pk-1,.mflow[data-mode="c2l2h"] .pk-2,
.mflow[data-mode="tr"] .pk-1,.mflow[data-mode="tr"] .pk-2{opacity:1}
.mflow[data-mode="tr"] .chip{opacity:1}
.mdesc{margin-top:8px;min-height:3.2em;color:var(--ink-2);max-width:70ch}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.areas li{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(7,18,40,.55);font-weight:600;font-size:.92rem}
.areas li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
@media(max-width:760px){.areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sub{font:500 .72rem var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:30px}

/* architecture */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch;margin-top:34px}
.flow .st{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.flow .st b{display:block;font:700 1.05rem var(--f-display)}
.flow .st span{font-size:.85rem;color:var(--ink-2)}
.flow .ar{align-self:center;color:var(--cyan);font:700 1.3rem var(--f-mono)}
.flow .st:nth-child(1){border-color:rgba(234,246,255,.5)}
.flow .st:nth-child(3){border-color:rgba(63,178,255,.55)}
.flow .st:nth-child(5){border-color:rgba(47,123,255,.65)}
@media(max-width:560px){.flow{grid-template-columns:1fr}.flow .ar{transform:rotate(90deg);justify-self:center}}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards .panel h3{color:var(--cyan);font-family:var(--f-mono);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.cards .panel b{display:block;font:700 1.35rem var(--f-display);letter-spacing:-.02em;margin-top:8px}
.cards .panel p{margin-top:10px;font-size:.92rem;color:var(--ink-2)}
@media(max-width:900px){.cards{grid-template-columns:1fr}}

/* development */
.dev{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:start}
@media(max-width:900px){.dev{grid-template-columns:1fr}}
.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:560px){.gates{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gates button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(7,18,40,.55);transition:all .3s;min-height:84px}
.gates i{font:700 .72rem var(--f-mono);font-style:normal;letter-spacing:.14em;color:var(--ink-3)}
.gates span{font-weight:600;font-size:.92rem;line-height:1.3}
.gates button:hover{border-color:var(--line-2)}
.gates button[aria-selected="true"]{border-color:var(--cyan);background:linear-gradient(160deg,rgba(31,102,255,.4),rgba(7,18,40,.7));box-shadow:0 0 28px rgba(38,225,255,.18)}
.gates button[aria-selected="true"] i{color:var(--cyan)}
.gdet{margin-top:16px;min-height:3.2em;color:var(--ink-2)}
.gnote{margin-top:6px;font:500 .74rem var(--f-mono);letter-spacing:.06em;color:var(--ink-3)}
figure{margin:0}
figure img{display:block;width:100%;height:auto;border-radius:20px;border:1px solid var(--line-2);box-shadow:0 0 60px rgba(47,123,255,.25)}
figcaption{margin-top:10px;font:500 .72rem var(--f-mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}

/* partnership */
.quote{font:600 clamp(1.3rem,2.6vw,2rem)/1.3 var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin-top:34px;max-width:30ch}
.quote em{font-style:normal;color:var(--cyan)}
.aud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:900px){.aud{grid-template-columns:1fr}}
.aud h3{font-size:1.15rem}
.aud ul{display:grid;gap:12px;margin-top:16px}
.aud li{position:relative;padding-left:22px;color:var(--ink-2);font-size:.95rem;line-height:1.5}
.aud li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:2px;background:var(--cyan)}
.pnote{margin-top:6px;font:500 .78rem var(--f-mono);letter-spacing:.06em;color:var(--ink-3)}

/* contact */
.card{margin-top:30px;max-width:560px}
.who{display:flex;gap:16px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.who img{width:56px;height:56px}
.who h3{font-size:1.5rem;letter-spacing:-.02em}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding-top:18px}
.lbl{font:500 .7rem var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.crow a{font-weight:600;font-size:1.05rem;text-decoration:none;overflow-wrap:anywhere}
.crow a:hover{color:var(--cyan)}
.card{min-width:0}
@media(max-width:640px){.crow{grid-template-columns:minmax(0,1fr) auto}.lbl{grid-column:1 / -1}}
.cp{padding:9px 14px;border-radius:10px;border:1px solid var(--line-2);background:rgba(10,26,54,.7);font:600 .78rem var(--f-mono);letter-spacing:.06em}
.cp:hover{border-color:var(--cyan)}
.tag{margin-top:34px;font:600 clamp(1.5rem,3vw,2.3rem)/1.2 var(--f-display);font-style:italic;letter-spacing:-.02em}
footer{padding-block:34px 90px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,rgba(3,8,20,.8))}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;font:500 .74rem var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:12px 20px;border-radius:12px;background:#0b2350;border:1px solid var(--cyan);font:600 .85rem var(--f-mono);opacity:0;pointer-events:none;transition:all .3s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* reveal: elements are visible by default; JS marks only below-the-fold ones */
.rv{transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.pre{opacity:0;transform:translateY(14px)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rv.pre{opacity:1;transform:none}
}

/* ===== luxury pass ===== */
.veil{overflow:hidden}
.veil::before{content:"";position:absolute;inset:-25%;background:conic-gradient(from 0deg at 70% 35%,rgba(38,225,255,.13),transparent 25%,rgba(125,90,255,.12) 50%,transparent 75%,rgba(38,225,255,.13));filter:blur(80px);animation:aur 32s linear infinite}
.veil::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(120,170,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.055) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(75% 65% at 50% 40%,#000,transparent);mask-image:radial-gradient(75% 65% at 50% 40%,#000,transparent)}
@keyframes aur{to{transform:rotate(1turn)}}
h1{text-shadow:0 0 60px rgba(47,123,255,.45),0 2px 30px rgba(0,0,0,.4)}
h2{text-shadow:0 0 40px rgba(47,123,255,.25)}
.brand img{border-radius:11px;box-shadow:0 0 0 1px rgba(120,190,255,.35),0 0 26px rgba(47,123,255,.6)}
.who img{border-radius:16px;box-shadow:0 0 0 1px rgba(120,190,255,.35),0 0 34px rgba(47,123,255,.55)}
.pill,.card,.status{background:linear-gradient(160deg,rgba(18,46,96,.58),rgba(5,14,34,.72));border:1px solid rgba(120,190,255,.3);box-shadow:0 14px 44px rgba(0,10,40,.55),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,border-color .4s}
.pill:hover,.card:hover{transform:translateY(-4px);border-color:rgba(38,225,255,.65);box-shadow:0 18px 56px rgba(0,10,40,.6),0 0 34px rgba(38,225,255,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.nav{box-shadow:0 8px 40px rgba(0,8,30,.55)}
.eyebrow{text-shadow:0 0 18px rgba(38,225,255,.6)}
.cp{background:linear-gradient(135deg,rgba(47,123,255,.35),rgba(38,225,255,.18));box-shadow:0 0 22px rgba(38,225,255,.2)}
.tag{background:linear-gradient(90deg,#fff,#9fe8ff 60%,#ffc98a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
/* CSS 3D fallback stack: shown only when WebGL is unavailable */
.fb{display:none;position:fixed;z-index:0;top:48%;right:5vw;width:min(36vw,440px);aspect-ratio:1;transform:translateY(-50%);perspective:1500px;pointer-events:none}
.nogl .fb{display:block}.nogl #gl{display:none}
.fb .st{position:absolute;inset:0;transform-style:preserve-3d;animation:fbs 16s ease-in-out infinite alternate}
.fb i{position:absolute;inset:8%;border-radius:18%;border:1.5px solid var(--c);background:linear-gradient(135deg,rgba(47,123,255,.3),rgba(8,24,60,.55));box-shadow:0 0 34px var(--c),inset 0 0 26px rgba(38,225,255,.2);transform:translateZ(calc(var(--k)*50px - 100px))}
@keyframes fbs{from{transform:rotateX(62deg) rotateZ(-50deg)}to{transform:rotateX(57deg) rotateZ(-26deg)}}
@media(max-width:900px){.fb{right:50%;top:34%;width:68vw;transform:translate(50%,-50%);opacity:.5}}
</style>
</head>

function initGL(){

  renderer.setClearColor(0x000000,0);
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(35,1,.1,120);
  var AM=THREE.AdditiveBlending;

  scene.add(new THREE.AmbientLight(0x6f9bff,.9));
  var dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,6,4);scene.add(dl);
  var pl1=new THREE.PointLight(0x26e1ff,1.3,24);pl1.position.set(-4,3,3);scene.add(pl1);
  var pl2=new THREE.PointLight(0x2f7bff,1.1,24);pl2.position.set(4,-3,3);scene.add(pl2);

  function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
  function radial(){var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
  function shapeRR(w,r){var s=new THREE.Shape(),x=-w/2,y=-w/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+w-r);s.quadraticCurveTo(x+w,y+w,x+w-r,y+w);s.lineTo(x+r,y+w);s.quadraticCurveTo(x,y+w,x,y+w-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}

  var LAYERS=[{n:'AI',c:'#eaf6ff'},{n:'VOICE',c:'#7fe3ff'},{n:'SOFTWARE',c:'#3fb2ff'},{n:'OS',c:'#2f7bff'},{n:'HARDWARE',c:'#2456d6'}];
  function drawTex(cv,idx,L){
    var g=cv.getContext('2d');g.clearRect(0,0,512,512);
    g.strokeStyle=L.c;g.fillStyle=L.c;g.lineCap='round';g.lineJoin='round';
    rr(g,24,24,464,464,84);g.lineWidth=3;g.globalAlpha=.6;g.stroke();
    g.globalAlpha=.12;g.lineWidth=1;
    for(var i=64;i<512;i+=48){g.beginPath();g.moveTo(i,70);g.lineTo(i,442);g.stroke();g.beginPath();g.moveTo(70,i);g.lineTo(442,i);g.stroke()}
    g.globalAlpha=1;g.lineWidth=5;
    var k=idx,cx=256,cy=226;
    if(k===0){g.beginPath();g.arc(cx,cy,34,0,6.283);g.stroke();
      for(var j=0;j<6;j++){var a=j*Math.PI/3+.3,x=cx+Math.cos(a)*90,y=cy+Math.sin(a)*90;g.beginPath();g.moveTo(cx+Math.cos(a)*34,cy+Math.sin(a)*34);g.lineTo(x,y);g.stroke();g.beginPath();g.arc(x,y,10,0,6.283);g.fill()}}
    else if(k===1){var hs=[30,64,110,76,128,70,100,52,26];for(var q=0;q<hs.length;q++){var xx=cx+(q-4)*28;g.beginPath();g.moveTo(xx,cy-hs[q]/2);g.lineTo(xx,cy+hs[q]/2);g.stroke()}}
    else if(k===2){g.font='700 110px "JetBrains Mono",monospace';g.textAlign='center';g.fillText('</>',cx,cy+38)}
    else if(k===3){g.strokeRect(cx-44,cy-44,88,88);g.strokeRect(cx-20,cy-20,40,40);for(var p=0;p<4;p++){var o=-30+p*20;[[o,-44,o,-70],[o,44,o,70],[-44,o,-70,o],[44,o,70,o]].forEach(function(l){g.beginPath();g.moveTo(cx+l[0],cy+l[1]);g.lineTo(cx+l[2],cy+l[3]);g.stroke()})}}
    else{g.beginPath();g.arc(cx,cy+30,9,0,6.283);g.fill();g.beginPath();g.moveTo(cx,cy+30);g.lineTo(cx,cy+92);g.stroke();[44,78,112].forEach(function(r){g.beginPath();g.arc(cx,cy+30,r,-Math.PI*.85,-Math.PI*.15);g.stroke()})}
    g.font='700 38px "JetBrains Mono",monospace';g.textAlign='left';g.fillText('0'+(idx+1)+'  '+L.n,64,440);
  }

  var W=3.4,DP=.16,shape=shapeRR(W,.62);
  var slabGeo=new THREE.ExtrudeGeometry(shape,{depth:DP,bevelEnabled:false,curveSegments:10});
  slabGeo.rotateX(-Math.PI/2);slabGeo.translate(0,-DP/2,0);
  var edgeGeo=new THREE.EdgesGeometry(slabGeo,25);
  var planeGeo=new THREE.PlaneGeometry(W*.96,W*.96);planeGeo.rotateX(-Math.PI/2);
  var haloGeo=new THREE.PlaneGeometry(8.5,8.5);haloGeo.rotateX(-Math.PI/2);
  var haloTex=radial(),maxA=renderer.capabilities.getMaxAnisotropy();

  var stack=new THREE.Group();scene.add(stack);
  var layers=LAYERS.map(function(L,i){
    var col=new THREE.Color(L.c),cv=document.createElement('canvas');cv.width=cv.height=512;drawTex(cv,i,L);
    var tex=new THREE.CanvasTexture(cv);tex.anisotropy=maxA;
    var body=new THREE.Mesh(slabGeo,new THREE.MeshStandardMaterial({color:0x0a2350,emissive:col,emissiveIntensity:.1,metalness:.5,roughness:.3,transparent:true,opacity:.58,depthWrite:false}));

    var top=new THREE.Mesh(planeGeo,new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:.9,blending:AM,depthWrite:false}));top.position.y=DP/2+.004;
    var hl=new THREE.Mesh(haloGeo,new THREE.MeshBasicMaterial({map:haloTex,color:col,transparent:true,opacity:.3,blending:AM,depthWrite:false}));hl.position.y=-.06;
    var g=new THREE.Group();g.add(hl,body,edges,top);stack.add(g);
    return {g:g,body:body,edges:edges,top:top,hl:hl,glow:.62,cv:cv,tex:tex,L:L,i:i};
  });
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){layers.forEach(function(o){drawTex(o.cv,o.i,o.L);o.tex.needsUpdate=true})})}

  /* signal pulses running through the stack */
  var PN=70,pg=new THREE.BufferGeometry(),pp=new Float32Array(PN*3),pv=new Float32Array(PN);
  for(var i=0;i<PN;i++){pp[i*3]=(Math.random()-.5)*2.6;pp[i*3+1]=Math.random()*6-3;pp[i*3+2]=(Math.random()-.5)*2.6;pv[i]=.4+Math.random()*.9}
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  var pm=new THREE.PointsMaterial({color:0x9ff6ff,size:.12,map:haloTex,transparent:true,opacity:.95,blending:AM,depthWrite:false,sizeAttenuation:true});
  stack.add(new THREE.Points(pg,pm));

  /* broadcast rings (the antenna waves from the logo) */
  var rings=[0,1,2].map(function(){var m=new THREE.Mesh(new THREE.RingGeometry(1,1.04,96),new THREE.MeshBasicMaterial({color:0x26e1ff,transparent:true,opacity:0,blending:AM,side:THREE.DoubleSide,depthWrite:false}));m.rotation.x=-Math.PI/2;stack.add(m);return m});

  /* sealed shield around the stack */
  var shield=new THREE.Mesh(new THREE.IcosahedronGeometry(3.1,2),new THREE.MeshBasicMaterial({color:0x26e1ff,wireframe:true,transparent:true,opacity:0,blending:AM,depthWrite:false}));
  /* no decorative shield */

  /* validation scanner */
  var pts=shape.getPoints(32).map(function(p){return new THREE.Vector3(p.x*1.08,0,-p.y*1.08)});
  var scan=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:AM,depthWrite:false}));
  var scanGlow=new THREE.Mesh(haloGeo,new THREE.MeshBasicMaterial({map:haloTex,color:0x9fe8ff,transparent:true,opacity:0,blending:AM,depthWrite:false}));
  scanGlow.scale.set(.7,1,.7);stack.add(scan,scanGlow);

  /* globe of lights */
  var GN=2400,gp=new Float32Array(GN*3),gc=new Float32Array(GN*3),GR=3.4;
  for(var n=0;n<GN;n++){
    var yy=1-(n/(GN-1))*2,rr0=Math.sqrt(1-yy*yy),th=n*2.399963;
    gp[n*3]=Math.cos(th)*rr0*GR;gp[n*3+1]=yy*GR;gp[n*3+2]=Math.sin(th)*rr0*GR;
    var b=.3+Math.random()*.7,amb=Math.random()<.06;
    gc[n*3]=amb?.9:.15*b;gc[n*3+1]=amb?.97:.55*b;gc[n*3+2]=1*b;
  }
  var gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(gp,3));gg.setAttribute('color',new THREE.BufferAttribute(gc,3));
  var gm=new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.9,blending:AM,depthWrite:false,sizeAttenuation:true});
  var globe=new THREE.Points(gg,gm);scene.add(globe);
  var gHalo=new THREE.Mesh(new THREE.PlaneGeometry(GR*3.1,GR*3.1),new THREE.MeshBasicMaterial({map:haloTex,color:0x2f7bff,transparent:true,opacity:.3,blending:AM,depthWrite:false}));scene.add(gHalo);

  var KF=[
   {sx:.46,sy:0,ex:.42,rot:0,cy:3.0,cz:11,globe:.8,gy:-6.2,sig:.6,beam:0,shield:0},
   {sx:-.46,sy:0,ex:.75,rot:-.25,cy:2.4,cz:11.5,globe:.5,gy:-6.8,sig:.3,beam:0,shield:0},
   {sx:.46,sy:0,ex:.25,rot:.35,cy:3.0,cz:11,globe:.55,gy:-6.6,sig:1,beam:0,shield:0},
   {sx:-.46,sy:0,ex:1,rot:.1,cy:1.2,cz:12.5,globe:.35,gy:-7.2,sig:.3,beam:0,shield:0},
   {sx:.46,sy:0,ex:.45,rot:-.2,cy:3.2,cz:11.5,globe:.4,gy:-6.8,sig:.4,beam:1,shield:0},
   {sx:-.46,sy:0,ex:.15,rot:.5,cy:2.8,cz:11,globe:.5,gy:-6.4,sig:.3,beam:0,shield:0},
   {sx:.46,sy:0,ex:0,rot:0,cy:3.2,cz:11,globe:1,gy:-4.9,sig:1,beam:0,shield:0}
  ];
  var KEYS=['sx','sy','ex','rot','cy','cz','globe','gy','sig','beam','shield'];
  var S={};KEYS.forEach(function(k){S[k]=KF[0][k]});
  var T=0,last=performance.now(),narrow=false,aspect=1;

  function resize(){

    if(narrow){tg.sx=0;tg.sy+=1.1;tg.cz+=2.6;scale=.78}
    var k=RM?1:1-Math.exp(-dt*4);

  }

  return {resize:resize};
}
